name: Receipt AI - isolated synthetic HTTP smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/receipt-http-smoke.yml
      - scripts/ci-receipt-http-smoke.mjs
  push:
    branches:
      - work/receipt-security-smoke-20261018

permissions:
  contents: read

jobs:
  synthetic-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ""
      BLOB_READ_WRITE_TOKEN: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      APP_BASIC_AUTH_USERNAME: ""
      APP_BASIC_AUTH_PASSWORD_SHA256: ""
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use project Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies without lifecycle scripts
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Build with local-only database fixture path
        shell: bash
        run: |
          set -euo pipefail
          export TURSO_DATABASE_URL="file:$RUNNER_TEMP/receipt-dummy-build.sqlite"
          export TURSO_AUTH_TOKEN="CI_ONLY_DUMMY"
          npm run build
      - name: Test HTTP, auth, filtering and exports with generated fixtures
        run: node scripts/ci-receipt-http-smoke.mjs
      - name: Verify source tree unchanged
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
