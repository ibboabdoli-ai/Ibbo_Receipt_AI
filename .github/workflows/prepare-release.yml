name: Prepare receipt release checks

on:
  push:
    branches:
      - agent/receipt-ci-lock

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURSO_DATABASE_URL: "libsql://build-placeholder.turso.io"
      TURSO_AUTH_TOKEN: "build-placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/receipt-ci-lock
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and update lockfile
        run: npm install

      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Replace temporary workflow with permanent CI
        shell: bash
        run: |
          rm .github/workflows/prepare-release.yml
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              env:
                NEXT_TELEMETRY_DISABLED: "1"
                TURSO_DATABASE_URL: "libsql://build-placeholder.turso.io"
                TURSO_AUTH_TOKEN: "build-placeholder"
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run test
                - run: npm run typecheck
                - run: npm run lint
                - run: npm run build
          YAML

      - name: Commit lockfile and CI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows
          git commit -m "[skip vercel] ci: lock dependencies and validate release"
          git push origin HEAD:agent/receipt-ci-lock
