name: Apply complete receipt roadmap

on:
  push:
    branches:
      - agent/receipt-roadmap-complete

permissions:
  contents: write
  issues: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NEXT_TELEMETRY_DISABLED: "1"
      TURSO_DATABASE_URL: "libsql://build-placeholder.turso.io"
      TURSO_AUTH_TOKEN: "build-placeholder"
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/receipt-roadmap-complete
          fetch-depth: 0

      - name: Reassemble and verify roadmap package
        shell: bash
        run: |
          {
            gh api "repos/${GITHUB_REPOSITORY}/issues/3" --jq .body
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/3/comments" --jq '.[].body'
          } | sed '/^CHUNK[0-9][0-9][0-9]$/d' | tr -d '\r\n' > /tmp/receipt-roadmap.b64
          base64 --decode /tmp/receipt-roadmap.b64 > /tmp/receipt-roadmap.tar.xz
          echo "bac8fca2525356149c9e49116af4e8a9b4441d611e05d42585c9b96bac8cacba  /tmp/receipt-roadmap.tar.xz" | sha256sum -c -
          tar -xJf /tmp/receipt-roadmap.tar.xz -C .
          rm -f .github/workflows/implement-receipt-roadmap.yml

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit complete roadmap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete receipt workflow and bookkeeping readiness"
          git push origin HEAD:agent/receipt-roadmap-complete
          gh issue close 3 --comment "Roadmap payload applied and validated. Temporary transport issue closed automatically."
